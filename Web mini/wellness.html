<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="page-container">

        <h1>Employee Wellness Tracker</h1>

        <div class="glass-box">

            <label>Stress Level</label>

            <input type="range" min="1" max="10" id="stress">

            <button onclick="checkStress()">Analyze Stress</button>

            <div id="stressResult"></div>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
